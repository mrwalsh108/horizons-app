<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizons Risk Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 120s linear infinite;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconSun = ({ className = "", size = 24, strokeWidth = 2 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
        );
        const IconLoader2 = ({ className = "", size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`animate-spin ${className}`}>
                <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
            </svg>
        );
        const IconAlertTriangle = ({ className = "", size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path>
            </svg>
        );
        const IconArrowRight = ({ className = "", size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path>
            </svg>
        );
        const IconRefreshCcw = ({ className = "", size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 21v-5h5"></path>
            </svg>
        );
        const IconShieldAlert = ({ className = "", size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path>
            </svg>
        );
        const IconInfo = ({ className = "", size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path>
            </svg>
        );
        const IconActivity = ({ className = "", size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
        );

        const SunBackground = () => (
            <div className="fixed inset-0 overflow-hidden pointer-events-none z-0 flex items-center justify-center">
                <IconSun className="text-yellow-400 opacity-20 animate-spin-slow" size={800} strokeWidth={0.5} />
            </div>
        );

        function HorizonsApp() {
            const [step, setStep] = useState('INPUT');
            const [plan, setPlan] = useState('');
            const [followUpQuestion, setFollowUpQuestion] = useState('');
            const [followUpAnswer, setFollowUpAnswer] = useState('');
            const [verdict, setVerdict] = useState(null);
            const [loadingText, setLoadingText] = useState('Initializing sequence...');
            const [errorMsg, setErrorMsg] = useState('');

            useEffect(() => {
                let interval;
                if (step === 'LOADING') {
                    const texts = [
                        'Querying baseline parameters...',
                        'Running risk assessment models...',
                        'Calculating environmental hazard coefficients...',
                        'Evaluating logistical dependencies...',
                        'Cross-referencing human error databases...',
                        'Finalizing mitigation strategy...',
                    ];
                    let i = 0;
                    interval = setInterval(() => {
                        i = (i + 1) % texts.length;
                        setLoadingText(texts[i]);
                    }, 2500);
                }
                return () => clearInterval(interval);
            }, [step]);

            const fetchVerdict = async (currentPlan, currentFollowUpAnswer = null) => {
                setStep('LOADING');
                setErrorMsg('');

                try {
                    const response = await fetch('/api/assess', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            plan: currentPlan,
                            followUpQuestion: followUpQuestion,
                            followUpAnswer: currentFollowUpAnswer
                        })
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error || 'Server error occurred.');
                    }

                    const parsedData = await response.json();

                    if (parsedData.needsFollowUp && !currentFollowUpAnswer) {
                        setFollowUpQuestion(parsedData.followUpQuestion);
                        setStep('FOLLOW_UP');
                    } else {
                        setVerdict(parsedData.verdict);
                        setStep('VERDICT');
                    }
                } catch (error) {
                    setErrorMsg(`System failure: ${error.message}. Unable to complete threat assessment at this time.`);
                    setStep('ERROR');
                }
            };

            const handleInitialSubmit = (e) => {
                e.preventDefault();
                if (!plan.trim()) return;
                fetchVerdict(plan);
            };

            const handleFollowUpSubmit = (e) => {
                e.preventDefault();
                if (!followUpAnswer.trim()) return;
                fetchVerdict(plan, followUpAnswer);
            };

            const resetApp = () => {
                setPlan('');
                setFollowUpQuestion('');
                setFollowUpAnswer('');
                setVerdict(null);
                setStep('INPUT');
            };

            return (
                <div className="min-h-screen bg-yellow-50 font-sans relative flex flex-col items-center justify-center p-4 sm:p-8">
                    <SunBackground />
                    
                    <main className="w-full max-w-xl z-10 relative">
                        <div className="bg-white/80 backdrop-blur-xl shadow-2xl rounded-3xl p-6 sm:p-10 border border-yellow-200/50">
                            
                            {step === 'INPUT' && (
                                <div className="animate-fade-in">
                                    <div className="text-center mb-8">
                                        <h1 className="text-5xl font-black text-yellow-600 mb-2 tracking-tight">Horizons</h1>
                                        <p className="text-yellow-800/70 font-medium">Objective Risk Assessment System.</p>
                                    </div>

                                    <form onSubmit={handleInitialSubmit} className="space-y-6">
                                        <div>
                                            <label htmlFor="plan" className="block text-xl font-bold text-yellow-900 mb-3 text-center">
                                                What are you up to today?
                                            </label>
                                            <textarea
                                                id="plan"
                                                value={plan}
                                                onChange={(e) => setPlan(e.target.value)}
                                                className="w-full h-32 bg-yellow-50 border-2 border-yellow-300 rounded-2xl p-4 text-yellow-900 placeholder-yellow-400 focus:outline-none focus:border-yellow-500 focus:ring-4 focus:ring-yellow-500/20 transition-all resize-none shadow-inner text-lg"
                                                placeholder="Input operational parameters here..."
                                            />
                                            <div className="flex items-start gap-2 mt-3 text-yellow-700/80 text-sm bg-yellow-100/50 p-3 rounded-lg border border-yellow-200">
                                                <IconInfo className="w-5 h-5 flex-shrink-0 mt-0.5" />
                                                <p><strong>Guidance:</strong> Enter as much detail as possible regarding your schedule, locations, and methods for a more accurate risk evaluation.</p>
                                            </div>
                                        </div>

                                        <button
                                            type="submit"
                                            disabled={!plan.trim()}
                                            className="w-full bg-yellow-500 hover:bg-yellow-600 disabled:bg-yellow-300 disabled:cursor-not-allowed text-white font-bold py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl transform transition-all active:scale-[0.98] flex items-center justify-center gap-2 text-lg"
                                        >
                                            Execute Protocol <IconArrowRight className="w-5 h-5" />
                                        </button>
                                    </form>
                                </div>
                            )}

                            {step === 'FOLLOW_UP' && (
                                <div className="animate-fade-in">
                                    <div className="text-center mb-6">
                                        <div className="inline-flex items-center justify-center w-16 h-16 bg-yellow-100 text-yellow-600 rounded-full mb-4">
                                            <IconActivity size={32} />
                                        </div>
                                        <h2 className="text-2xl font-bold text-yellow-900 mb-2">Insufficient Data</h2>
                                        <p className="text-yellow-700">Provide the requested variables to complete the matrix:</p>
                                    </div>

                                    <form onSubmit={handleFollowUpSubmit} className="space-y-6">
                                        <div className="bg-yellow-50 border-l-4 border-yellow-500 p-4 rounded-r-xl shadow-sm mb-6 text-lg font-medium text-yellow-900">
                                            "{followUpQuestion}"
                                        </div>
                                        
                                        <textarea
                                            value={followUpAnswer}
                                            onChange={(e) => setFollowUpAnswer(e.target.value)}
                                            className="w-full h-24 bg-yellow-50 border-2 border-yellow-300 rounded-xl p-4 text-yellow-900 focus:outline-none focus:border-yellow-500 focus:ring-4 focus:ring-yellow-500/20 transition-all resize-none shadow-inner"
                                            placeholder="Input data..."
                                            autoFocus
                                        />

                                        <button
                                            type="submit"
                                            disabled={!followUpAnswer.trim()}
                                            className="w-full bg-yellow-500 hover:bg-yellow-600 disabled:bg-yellow-300 text-white font-bold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all active:scale-[0.98] flex items-center justify-center gap-2"
                                        >
                                            Transmit Data <IconArrowRight className="w-5 h-5" />
                                        </button>
                                    </form>
                                </div>
                            )}

                            {step === 'LOADING' && (
                                <div className="flex flex-col items-center justify-center py-12 animate-fade-in">
                                    <IconLoader2 className="w-16 h-16 text-yellow-500 mb-6" />
                                    <h2 className="text-xl font-bold text-yellow-900 text-center">{loadingText}</h2>
                                </div>
                            )}

                            {step === 'ERROR' && (
                                <div className="text-center py-8 animate-fade-in">
                                    <IconShieldAlert className="w-16 h-16 text-red-400 mx-auto mb-4" />
                                    <h2 className="text-2xl font-bold text-yellow-900 mb-4">Assessment Incomplete</h2>
                                    <p className="text-yellow-800 mb-8">{errorMsg}</p>
                                    <button
                                        onClick={() => setStep('INPUT')}
                                        className="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-bold py-3 px-6 rounded-xl transition-colors flex items-center justify-center gap-2 mx-auto"
                                    >
                                        <IconRefreshCcw className="w-4 h-4" /> Try Again
                                    </button>
                                </div>
                            )}

                            {step === 'VERDICT' && verdict && (
                                <div className="animate-fade-in space-y-8">
                                    <div className="text-center">
                                        <IconShieldAlert className="w-12 h-12 text-yellow-600 mx-auto mb-3" />
                                        <h2 className="text-3xl font-black text-yellow-900 tracking-tight">Assessment Complete. Vulnerabilities Identified.</h2>
                                    </div>

                                    <div className="space-y-6 text-left">
                                        <div className="bg-red-50/80 border border-red-200 rounded-2xl p-6 shadow-sm relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-2 h-full bg-red-400"></div>
                                            <h3 className="text-lg font-bold text-red-900 mb-2 flex items-center gap-2">
                                                <IconAlertTriangle className="w-5 h-5" /> Primary Failure Vector
                                            </h3>
                                            <p className="text-red-950 leading-relaxed">{verdict.initialCatastrophe}</p>
                                        </div>

                                        <div className="bg-yellow-50 border border-yellow-200 rounded-2xl p-6 shadow-sm relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-2 h-full bg-yellow-400"></div>
                                            <h3 className="text-lg font-bold text-yellow-900 mb-2">Standard Mitigation Protocol</h3>
                                            <p className="text-yellow-800 leading-relaxed mb-4">{verdict.saferSolution}</p>
                                            
                                            <div className="bg-white/50 p-4 rounded-xl border border-yellow-100">
                                                <h4 className="text-sm font-bold text-orange-800 uppercase tracking-wide mb-1">Secondary Failure Vectors:</h4>
                                                <p className="text-orange-900 text-sm leading-relaxed">{verdict.saferSolutionCatastrophe}</p>
                                            </div>
                                        </div>

                                        <div className="bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-xl relative overflow-hidden text-gray-100">
                                            <div className="absolute top-0 left-0 w-2 h-full bg-gray-500"></div>
                                            <h3 className="text-lg font-bold text-gray-200 mb-2 flex items-center gap-2">
                                                <IconShieldAlert className="w-5 h-5 text-gray-400" /> Optimal Safety Recommendation
                                            </h3>
                                            <p className="text-gray-300 leading-relaxed font-medium italic">{verdict.ultimateSafeSolution}</p>
                                        </div>
                                    </div>

                                    <button
                                        onClick={resetApp}
                                        className="w-full bg-yellow-100 hover:bg-yellow-200 text-yellow-900 font-bold py-4 px-6 rounded-xl transition-all active:scale-[0.98] flex items-center justify-center gap-2 shadow"
                                    >
                                        <IconRefreshCcw className="w-5 h-5" /> Initialize New Assessment
                                    </button>
                                </div>
                            )}

                        </div>
                        
                        <p className="text-center text-yellow-700/50 mt-6 text-sm font-medium">
                            Horizons Risk Assessment © 2026. Automated Risk Extrapolation.
                        </p>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HorizonsApp />);
    </script>
</body>
</html>
